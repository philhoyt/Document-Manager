name: Release

on:
  push:
    tags:
      # Lowercase "v" only. Plugin Update Checker strips the prefix with
      # ltrim( $tag, 'v' ), which is case-sensitive — a "V1.1.0" tag is left
      # as "V1.1.0" and version_compare() then ranks it BELOW a plain
      # "1.0.0", so updates are never offered.
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install JS dependencies
        run: npm ci

      # Runs the same script used locally: build, install runtime-only Composer
      # dependencies, then zip. vendor/ must ship — the plugin autoloads its own
      # classes and Plugin Update Checker from vendor/autoload.php at runtime.
      - name: Build plugin zip
        run: npm run plugin-zip

      - name: Verify the zip contains everything package.json promises
        run: |
          node -e "
          const p = require('./package.json');
          const { execSync } = require('child_process');
          const zip = p.name + '.zip';
          const contents = execSync('unzip -l ' + zip).toString();
          const missing = (p.files || []).filter((f) => !contents.includes(f.replace('/**', '')));
          if (missing.length) {
            console.error('MISSING from zip: ' + missing.join(', '));
            process.exit(1);
          }
          console.log('Zip OK — ' + zip);
          "

      - name: Extract changelog for this version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk "/^= ${VERSION} =/{found=1} found && /^= [0-9]/ && !/^= ${VERSION} =/{exit} found{print}" readme.txt > changelog_body.txt
          cat changelog_body.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ph-document-manager.zip
            readme.txt
          body_path: changelog_body.txt
